spring:
  application:
    name: registry-server

server:
  port: ${PORT:8761}
  shutdown: graceful

# Eureka holds the service list; it doesn't register with itself.
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false   # a demo: drop stopped instances quickly

# Internal network only, and only these endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay service registry (Eureka)"
    version: ${BUILD_VERSION:dev}
